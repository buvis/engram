# Gold set for engram retrieval eval (PRD 00001).
#
# Each entry pairs a natural-language query with the single file that should
# surface in engram's top-5 for it, plus the corpus that file belongs to.
# All expected_path values are absolute and were verified to exist on disk at
# authoring time. Live harness runs require these paths to exist. Snapshot
# evaluation validates exact private copies against sources.json instead;
# the original expected_path identities are never replaced by storage paths.
# Both routes reject unknown corpora or fewer than 30 entries.
#
# Corpora present: memory, prd, decision, discovery, transcripts, code.
# Decision entries added 2026-11-01 from the agent-plugins decision record,
# before scoring. They cover distinct decisions in the portfolio's one current
# decisions.md; this checks file retrieval, not independent-document diversity.
#
# PRD/discovery re-anchoring in 3bad0f2: calcard-mcp 00032 and gems 00071/00045
# no longer exist by their original basenames. calcard-mcp 00036 moved to
# intake/new/ and gems 00062 to research/; neither directory is indexed as the
# original corpus. Verified across those repositories on 2026-11-01. The old
# dev/local files were ignored, so there is no tracked deletion history. Four
# PRD queries and one discovery query were replaced; the historical score is
# specific to that revised set and is not a before/after quality comparison.
#
# Transcript replacement 2026-11-09: cellar sync removed session 5a656567
# (the repository-template flexibility incident). Seed 20261109 over sorted
# current transcript paths selected the first substantive human session after
# three reviewer sessions: 5729c201 (OVCAQ/Herdr identity and state reporting).
# Its retained turns at lines 13 and 389 establish the label, before any scoring.
# The new query changes the evaluation set; previous scores are not comparable.

