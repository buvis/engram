# Gold set for engram retrieval eval (PRD 00001).
#
# Each entry pairs a natural-language query with the single file that should
# surface in engram's top-5 for it, plus the corpus that file belongs to.
# All expected_path values are absolute and were verified to exist on disk at
# authoring time; load_goldset() re-checks existence and rejects the whole set
# if any path is missing, any corpus is unknown, or there are fewer than 30
# entries.
#
# Corpora present: memory, prd, discovery, transcripts, code. The "decision" corpus
# (<repo>/dev/local/decisions.md) currently has no files anywhere in the
# portfolio, so it is unrepresented here — add decision entries once a real
# decisions.md exists.

