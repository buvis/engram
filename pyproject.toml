[project]
name = "engram"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlite-vec>=0.1.9",
    "pyyaml>=6",
    "tree-sitter-language-pack==1.25.0",
]

[project.scripts]
engram = "engram.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "private: needs the maintainer's private retained evidence; CI deselects it with -m 'not private'",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
